<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Smartphone</title>
    <style>
        body {
            display: flex;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 93.3vw;
            background-image: url("https://images.unsplash.com/photo-1723323419477-455f28ebd193?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
            background-repeat: no-repeat;
            background-size: cover;
            margin: 0;
        }
        .time {
            display: flex;
            align-items: center;
            top: 20px;
            left: 10%;
            color: white;
            font-size: 10vw;
            font-family: Arial, sans-serif;
        }
        .date {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="phone-screen">
        <div class="time">9:41</div>
        <div class="date">APR 10, 2019</div>
    </div>
</body>
</html>
