<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em espera</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900" rel="stylesheet">
    <style>
        body {
            display: flex;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 92vw;
            background-color: #000000;
            margin: 0;
        }

        #clock {
            display: flex;
            align-items: center;
            font-size: 22vw;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            letter-spacing: -0.35em;
        }

        #hourTens {
            transform: rotate(-4deg);
            color: rgba(87, 248, 178, 0.65);
        }

        #hourOnes {
            transform: rotate(4deg);
            color: rgba(248, 87, 157, 0.65);
        }

        #separator {
            transform: rotate(0deg);
            color: rgba(5, 255, 255, 0.85);
        }

        #minuteTens {
            transform: rotate(-4deg);
            color: rgba(238, 248, 87, 0.65);
        }

        #minuteOnes {
            transform: rotate(4deg);
            color: rgba(98, 87, 248, 0.65)
        }

        #secTens {
            transform: rotate(-4deg);
            color: rgba(238, 248, 87, 0.65);
        }

        #secOnes {
            transform: rotate(4deg);
            color: rgba(98, 87, 248, 0.65)
        }

        #button-container {
            position: absolute;
            bottom: 20px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        #centerButton {
            padding: 10px 20px;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            background-color: #33333320;
            color: #ffffff20;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 10px;
        }

        #centerButton:hover {
            background-color: #55555520;
        }
    </style>
</head>

<body>
    <div id="clock" href="/calendar.html">
        <h1 id="hourTens">0</h1>
        <h1 id="hourOnes">0</h1>
        <h1 id="separator">:</h1>
        <h1 id="minuteTens">0</h1>
        <h1 id="minuteOnes">0</h1>
        <!--<h1 id="separator">:</h1>
        <h1 id="secTens">0</h1>
        <h1 id="secOnes">0</h1>-->
    </div>
    <div id="button-container">
        <button id="centerButton" onclick="window.location.href='index.html'">relógio</button>
        <button id="centerButton" onclick="window.location.href='calendar.html'">calendário</button>
        <button id="centerButton" onclick="window.location.href='wimage.html'">imagem do dia</button>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            console.log(seconds);
            document.getElementById('hourTens').textContent = hours.charAt(0);
            document.getElementById('hourOnes').textContent = hours.charAt(1);
            document.getElementById('minuteTens').textContent = minutes.charAt(0);
            document.getElementById('minuteOnes').textContent = minutes.charAt(1);
            //document.getElementById('secTens').textContent = seconds.charAt(0);
            //document.getElementById('secOnes').textContent = seconds.charAt(1);
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>

</html>
